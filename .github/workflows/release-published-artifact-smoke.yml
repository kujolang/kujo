name: release-published-artifact-smoke

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Published release tag to validate"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-published-artifact-install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            binary_name: kujo
            archive_ext: tar.gz
            archive_kind: tar
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            binary_name: kujo
            archive_ext: tar.gz
            archive_kind: tar
          - os: macos-15-intel
            platform: macos-x64
            binary_name: kujo
            archive_ext: tar.gz
            archive_kind: tar
          - os: macos-15
            platform: macos-arm64
            binary_name: kujo
            archive_ext: tar.gz
            archive_kind: tar
          - os: windows-latest
            platform: windows-x64
            binary_name: kujo.exe
            archive_ext: zip
            archive_kind: zip

    steps:
      - name: Download and verify published artifact
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag_name }}
        run: |
          set -euo pipefail
          tag_name="${RELEASE_TAG}"
          if [[ -z "${tag_name}" ]]; then
            echo "release tag is required" >&2
            exit 2
          fi
          repo="${{ github.repository }}"
          archive_name="kujo-${tag_name}-${{ matrix.platform }}.${{ matrix.archive_ext }}"
          checksum_name="${archive_name}.sha256"
          base_url="https://github.com/${repo}/releases/download/${tag_name}"

          curl -sSfL "${base_url}/${archive_name}" -o "${archive_name}"
          curl -sSfL "${base_url}/${checksum_name}" -o "${checksum_name}"

          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -c "${checksum_name}"
          elif command -v shasum >/dev/null 2>&1; then
            shasum -a 256 -c "${checksum_name}"
          else
            expected="$(cut -d ' ' -f 1 "${checksum_name}" | tr '[:upper:]' '[:lower:]')"
            actual="$(pwsh -NoLogo -NoProfile -Command "(Get-FileHash -Algorithm SHA256 '${archive_name}').Hash.ToLower()")"
            [[ "${expected}" == "${actual}" ]]
          fi

          extract_root="${PWD}/artifact-extract"
          rm -rf "${extract_root}"
          mkdir -p "${extract_root}"

          if [[ "${{ matrix.archive_kind }}" == "zip" ]]; then
            native_extract_root="$(cygpath -w "${extract_root}")"
            pwsh -NoLogo -NoProfile -Command "Expand-Archive -Path '${archive_name}' -DestinationPath '${native_extract_root}' -Force"
          else
            tar -xzf "${archive_name}" -C "${extract_root}"
          fi

          binary_path="${extract_root}/${{ matrix.binary_name }}"
          chmod +x "${binary_path}" 2>/dev/null || true

          "${binary_path}" --version
          echo 'print("artifact-smoke")' > "${extract_root}/hello.kujo"
          "${binary_path}" run "${extract_root}/hello.kujo"
          "${binary_path}" lsp --help


          # Releases before 1.3.0 do not expose the native upgrade command.
          cli_help="$("${binary_path}" --help)"
          if grep -Eq '^[[:space:]]+upgrade[[:space:]]' <<< "${cli_help}"; then
            find "${extract_root}" -type f -exec cksum {} \; | sort > before-upgrade.txt
            "${binary_path}" upgrade "${tag_name}" --check --json > upgrade-check.json
            "${binary_path}" upgrade "${tag_name}" --json > upgrade-noop.json
            find "${extract_root}" -type f -exec cksum {} \; | sort > after-upgrade.txt
            cmp before-upgrade.txt after-upgrade.txt
            python3 - <<'PYTHON'
          import json, os
          expected = os.environ["RELEASE_TAG"].removeprefix("v")
          for filename in ["upgrade-check.json", "upgrade-noop.json"]:
              with open(filename) as stream:
                  result = json.load(stream)
              assert result["current_version"] == expected, result
              assert result["target_version"] == expected, result
              assert result["status"] == "up_to_date", result
              assert result["changed"] is False, result
              assert result["upgrade_available"] is False, result
              print(filename, result)
          PYTHON
          fi
