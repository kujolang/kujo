name: vm-code-lifetime

on:
  workflow_dispatch:
    inputs:
      checksum_only:
        description: Run only the all150 test-size checksum gate
        type: boolean
        default: false
      linux_only:
        description: Run the Linux owner/accounting gate before a full platform refresh
        type: boolean
        default: false
  workflow_call:
    inputs:
      windows_only:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checksum:
    if: inputs.checksum_only
    uses: ./.github/workflows/langarena-checksum-gate.yml
  lifetime:
    if: ${{ !inputs.checksum_only }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.linux_only && '["ubuntu-22.04"]' || inputs.windows_only && '["windows-latest"]' || '["ubuntu-22.04","ubuntu-24.04-arm","macos-15-intel","macos-15","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - name: Preserve repository line endings on Windows
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: dtolnay/rust-toolchain@stable
      - name: Record exact source and toolchain
        shell: bash
        run: |
          git rev-parse HEAD > lifetime-source.txt
          rustc --version --verbose >> lifetime-source.txt
      - name: Verify formatting
        run: cargo fmt --check
      - name: Test private code-owner lifetime
        id: owner
        run: cargo test --release --locked --lib code_owner_lifetime_tests -- --nocapture > lifetime-library.log 2>&1
      - name: Test owner boundary without JIT
        if: matrix.os == 'ubuntu-22.04'
        run: |
          cargo test --release --locked --no-default-features --lib code_owner_lifetime_tests -- --nocapture > lifetime-no-jit.log 2>&1
          cargo test --release --locked --no-default-features --lib disabled_network_web_helpers_report_feature_error -- --nocapture >> lifetime-no-jit.log 2>&1
      - name: Test native owner accounting
        if: always() && !cancelled() && steps.owner.outcome == 'success' && matrix.os == 'ubuntu-22.04'
        run: |
          cargo test --release --locked --lib owner_accounting_covers_each_native_definition_path -- --nocapture > lifetime-accounting.log 2>&1
          cargo test --release --locked --lib loop_statistics_include_reuse_and_mutated_code_identity -- --nocapture >> lifetime-accounting.log 2>&1
          cargo test --release --locked --lib owner_metadata_accounts_literals_capacity_and_unknown_payloads -- --nocapture >> lifetime-accounting.log 2>&1
          cargo test --release --locked --lib owner_reset_rejects_incomplete_or_incompatible_compilers -- --nocapture >> lifetime-accounting.log 2>&1
      - name: Test retained generators, callbacks and task state
        id: integration
        if: always() && !cancelled() && steps.owner.outcome == 'success'
        run: >-
          cargo test --release --locked --no-fail-fast --message-format=json
          --test generator_continuation_contracts
          --test imported_vm_callback
          --test callback_module_cache
          --test jit_callback_depth
          --test language_task_contracts
          --test jit_cold_callback
          --test task_jit_policy
          --test task_module_snapshot_contracts
          --test task_global_snapshot_contracts
          --test imported_task_globals_contracts > lifetime-integration.log 2>&1
      - name: Measure async task compilation reuse
        if: always() && !cancelled() && steps.integration.outcome == 'success' && matrix.os == 'ubuntu-22.04'
        run: |
          target/release/kujo run benchmarks/langarena/build.kujo > lifetime-economics.log 2>&1
          ruby benchmarks/langarena/probes/test-jit-async-reuse-verifier.rb >> lifetime-economics.log 2>&1
          ruby benchmarks/langarena/probes/collect-jit-async-economics.rb target/release/kujo owner-async-economics >> lifetime-economics.log 2>&1
          ruby benchmarks/langarena/probes/verify-jit-async-economics.rb owner-async-economics reuse >> lifetime-economics.log 2>&1
      - name: Measure isolated task-owner resources
        if: always() && !cancelled() && steps.integration.outcome == 'success' && matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          mkdir owner-resources
          ruby benchmarks/langarena/probes/test-owner-resource-verifier.rb > owner-resources/verifier-controls.json
          git rev-parse HEAD > owner-resources/source.txt
          cargo test --release --locked --lib --no-run --message-format=json > owner-resources/build.jsonl
          ruby benchmarks/langarena/probes/collect-owner-resources.rb owner-resources
          ruby benchmarks/langarena/probes/verify-owner-resources.rb owner-resources
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vm-code-lifetime-${{ matrix.os }}
          retention-days: 7
          path: |
            lifetime-source.txt
            lifetime-library.log
            lifetime-no-jit.log
            lifetime-accounting.log
            lifetime-integration.log
            lifetime-economics.log
            owner-async-economics/
            owner-resources/
