name: vm-code-lifetime

on:
  workflow_dispatch:
    inputs:
      priority_profile:
        description: Sample four priority kernels using the original frozen symbolized experiment
        type: boolean
        default: false
      scalar_write:
        description: Test and measure the isolated scalar indexed-write candidate
        type: boolean
        default: false
      sort_controls:
        description: Run identical-binary controls for the frozen local-store sorting comparison
        type: boolean
        default: false
      profile_only:
        description: Recheck Brainfuck sampling with the original frozen symbolized binary
        type: boolean
        default: false
      local_store_only:
        description: Run isolated local-store correctness and paired timing gates
        type: boolean
        default: false
      post_store_run:
        description: Completed local-store run whose frozen binaries need state and resource checks
        type: string
        default: ''
      owner_workloads:
        description: Measure the corrected owner experiment's frozen binaries on unchanged workloads
        type: boolean
        default: false
  workflow_call:
    inputs:
      windows_only:
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  priority-profile:
    if: inputs.priority_profile
    uses: ./.github/workflows/native-priority-profile.yml
  scalar-write:
    if: inputs.scalar_write && !inputs.priority_profile
    uses: ./.github/workflows/native-scalar-write.yml
  sort-controls:
    if: inputs.sort_controls && !inputs.scalar_write && !inputs.priority_profile
    uses: ./.github/workflows/native-sort-controls.yml
  profile:
    if: inputs.profile_only && !inputs.sort_controls && !inputs.scalar_write && !inputs.priority_profile
    uses: ./.github/workflows/native-bf-profile.yml
  local-store:
    if: inputs.local_store_only && inputs.post_store_run == '' && !inputs.owner_workloads && !inputs.profile_only && !inputs.sort_controls && !inputs.scalar_write && !inputs.priority_profile
    uses: ./.github/workflows/native-local-store.yml
  post-store:
    if: inputs.post_store_run != '' && !inputs.owner_workloads && !inputs.profile_only && !inputs.sort_controls && !inputs.scalar_write && !inputs.priority_profile
    uses: ./.github/workflows/native-local-store-followup.yml
    with:
      source_run: ${{ inputs.post_store_run }}
  owner-workloads:
    if: inputs.owner_workloads && !inputs.profile_only && !inputs.sort_controls && !inputs.scalar_write && !inputs.priority_profile
    uses: ./.github/workflows/native-owner-workloads.yml
  lifetime:
    if: ${{ !inputs.local_store_only && inputs.post_store_run == '' && !inputs.owner_workloads && !inputs.profile_only && !inputs.sort_controls && !inputs.scalar_write && !inputs.priority_profile }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.windows_only && '["windows-latest"]' || '["ubuntu-22.04","ubuntu-24.04-arm","macos-15-intel","macos-15","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - name: Preserve repository line endings on Windows
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: dtolnay/rust-toolchain@stable
      - name: Record exact source and toolchain
        shell: bash
        run: |
          git rev-parse HEAD > lifetime-source.txt
          rustc --version --verbose >> lifetime-source.txt
      - name: Verify formatting
        run: cargo fmt --check
      - name: Test private code-owner lifetime
        run: cargo test --release --locked --lib code_owner_lifetime_tests -- --nocapture > lifetime-library.log 2>&1
      - name: Test retained generators, callbacks and task state
        run: >-
          cargo test --release --locked --no-fail-fast --message-format=json
          --test generator_continuation_contracts
          --test imported_vm_callback
          --test callback_module_cache
          --test jit_callback_depth
          --test language_task_contracts
          --test jit_cold_callback
          --test task_jit_policy
          --test task_module_snapshot_contracts
          --test task_global_snapshot_contracts
          --test imported_task_globals_contracts > lifetime-integration.log 2>&1
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vm-code-lifetime-${{ matrix.os }}
          retention-days: 7
          path: |
            lifetime-source.txt
            lifetime-library.log
            lifetime-integration.log
