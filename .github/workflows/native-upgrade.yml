name: native-upgrade

on:
  workflow_dispatch:
    inputs:
      code_lifetime_only:
        description: Run isolated VM code-lifetime verification instead of upgrade tests
        type: boolean
        default: false
      code_lifetime_windows_only:
        description: Limit isolated code-lifetime verification to Windows
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:

jobs:
  code-lifetime:
    if: github.event_name == 'workflow_dispatch' && inputs.code_lifetime_only
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/vm-code-lifetime.yml
    with:
      windows_only: ${{ inputs.code_lifetime_windows_only }}

  native-upgrade:
    if: github.event_name != 'workflow_dispatch' || !inputs.code_lifetime_only
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Cargo enables openssl/vendored; a separate vcpkg build is unused.

      - name: Verify upgrade without language archive features
        run: cargo check --locked --no-default-features

      - name: Test native upgrades and running executable replacement
        run: cargo test --locked --bin kujo upgrade::tests

      - name: Repeat Linux upgrades under parallel test execution
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          for iteration in $(seq 1 20); do
            echo "Parallel upgrade iteration ${iteration}/20"
            cargo test --locked --bin kujo upgrade::tests -- --test-threads=16
          done

      - name: Test database lifecycle in both engines
        run: cargo test --locked --test database_lifecycle

      - name: Test upgrade CLI contracts
        run: cargo test --locked --test cli_contracts --test cli_json_contracts upgrade_
