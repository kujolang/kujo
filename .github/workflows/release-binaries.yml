name: release-binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Artifact version/name for manual runs (defaults to manual-<run number>)"
        required: false
        type: string

jobs:
  release-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Checkout AI SDK fixtures
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: kujolang/ai-sdk
          ref: be9617a32344728919b1394b80f72f46559d69a7
          path: .agent-fixtures/ai-sdk
          persist-credentials: false

      - name: Checkout Agents SDK fixtures
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: kujolang/agents-sdk
          ref: d3904d348754b492bda298b6c30f49c1eb24b7ea
          path: .agent-fixtures/agents-sdk
          persist-credentials: false

      - name: Checkout Eval fixtures
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: kujolang/eval
          ref: 955713f487c094b20b7b8c44414ae17395194cc9
          path: .agent-fixtures/eval
          persist-credentials: false

      - name: Checkout MCP fixtures
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: kujolang/mcp
          ref: 2ab8111f2c5174841204f5c762d8ce8d281e57b6
          path: .agent-fixtures/mcp
          persist-credentials: false

      - name: Checkout RAG fixtures
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: kujolang/rag
          ref: 28690e3aa1b7a5947616843574cacf03b32905c9
          path: .agent-fixtures/rag
          persist-credentials: false

      - name: Checkout Dispatch fixtures
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: kujolang/dispatch
          ref: 662417c264bd55f8d802eef3fc21f9f372590753
          path: .agent-fixtures/dispatch
          persist-credentials: false

      - name: Checkout RunLedger fixtures
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: kujolang/runledger
          ref: 12bbf2b3723325913eb75ececaba0ce3fdc68b87
          path: .agent-fixtures/runledger
          persist-credentials: false

      - name: Checkout Watchdog fixtures
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: kujolang/watchdog
          ref: 1af292b3e03217760649dcb4f903e443f48c563c
          path: .agent-fixtures/watchdog
          persist-credentials: false

      - name: Checkout Relay fixtures
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: kujolang/relay
          ref: 0480733735a69f3b01d5452e6c86b4df3343c9d6
          path: .agent-fixtures/relay
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run release gate checks
        env:
          KUJO_AGENT_FIXTURE_ECOSYSTEM_ROOT: ${{ github.workspace }}/.agent-fixtures
          KUJO_ENABLE_SOCKET_TESTS: "1"
        run: bash scripts/release_gate.sh

  build-release-artifacts:
    needs: release-gate
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_NAME: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.version || format('manual-{0}', github.run_number) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build the public Linux binary on the oldest supported Pages image.
          # This keeps its glibc floor compatible with Ubuntu 22.04 consumers.
          - os: ubuntu-22.04
            platform: linux-x64
            npm_target: linux-x64
            binary_name: kujo
            archive_ext: tar.gz
            archive_kind: tar
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            npm_target: linux-arm64
            binary_name: kujo
            archive_ext: tar.gz
            archive_kind: tar
          - os: macos-15-intel
            platform: macos-x64
            npm_target: darwin-x64
            binary_name: kujo
            archive_ext: tar.gz
            archive_kind: tar
          - os: macos-15
            platform: macos-arm64
            npm_target: darwin-arm64
            binary_name: kujo
            archive_ext: tar.gz
            archive_kind: tar
          - os: windows-latest
            platform: windows-x64
            npm_target: win32-x64
            binary_name: kujo.exe
            archive_ext: zip
            archive_kind: zip

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"

      - name: Configure OpenSSL for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) {
            $env:VCPKG_INSTALLATION_ROOT = "C:\vcpkg"
          }
          vcpkg install openssl:x64-windows-static-md
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VCPKG_DEFAULT_TRIPLET=x64-windows-static-md" | Out-File -FilePath $env:GITHUB_ENV -Append
          "OPENSSL_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-md" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build release binary
        run: cargo build --release --locked

      - name: Validate binary commands
        shell: bash
        run: |
          set -euo pipefail
          binary_path="target/release/${{ matrix.binary_name }}"
          "${binary_path}" --version
          "${binary_path}" run examples/hello.kujo
          "${binary_path}" lsp --help

      - name: Package artifact and checksum
        shell: bash
        run: |
          set -euo pipefail
          binary_name="${{ matrix.binary_name }}"
          binary_path="target/release/${binary_name}"
          archive_name="kujo-${RELEASE_NAME}-${{ matrix.platform }}.${{ matrix.archive_ext }}"
          mkdir -p dist
          cp "${binary_path}" "dist/${binary_name}"

          if [[ "${{ matrix.archive_kind }}" == "zip" ]]; then
            pwsh -NoLogo -NoProfile -Command "Compress-Archive -Path 'dist/${binary_name}' -DestinationPath '${archive_name}' -Force"
          else
            tar -czf "${archive_name}" -C dist "${binary_name}"
          fi

          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${archive_name}" > "${archive_name}.sha256"
          elif command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "${archive_name}" > "${archive_name}.sha256"
          else
            pwsh -NoLogo -NoProfile -Command "\$hash = (Get-FileHash -Algorithm SHA256 '${archive_name}').Hash.ToLower(); \"\$hash  ${archive_name}\" | Set-Content '${archive_name}.sha256'"
          fi

      - name: Pack lifecycle-script-free npm platform package
        shell: bash
        run: |
          set -euo pipefail
          npm_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          node npm/scripts/pack-platform.js \
            --target "${{ matrix.npm_target }}" \
            --binary "target/release/${{ matrix.binary_name }}" \
            --version "${npm_version}" \
            --git-commit "${GITHUB_SHA}" \
            --output npm-dist

      - name: Upload artifact bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ matrix.platform }}
          path: |
            kujo-*.tar.gz
            kujo-*.tar.gz.sha256
            kujo-*.zip
            kujo-*.zip.sha256
            npm-dist/*.tgz

  pack-npm-runtime:
    needs: build-release-artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"

      - name: Test and pack neutral npm runtime
        shell: bash
        run: |
          set -euo pipefail
          npm test --prefix npm
          npm run pack:dry-run --prefix npm
          npm_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          node npm/scripts/pack-runtime.js --version "${npm_version}" --output npm-dist

      - name: Upload neutral npm runtime
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-npm-runtime
          path: npm-dist/*.tgz

  publish-release-assets:
    needs: [build-release-artifacts, pack-npm-runtime]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write

    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: release-artifacts

      - name: Build consolidated checksums file
        shell: bash
        run: |
          set -euo pipefail
          find release-artifacts -name '*.sha256' -type f -print0 | sort -z | xargs -0 cat > release-artifacts/checksums.txt

      - name: Publish release assets
        id: publish
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          name: Kujo ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release-artifacts/**/*.tar.gz
            release-artifacts/**/*.zip
            release-artifacts/**/*.sha256
            release-artifacts/checksums.txt

      - name: Dispatch published artifact smoke
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run release-published-artifact-smoke.yml
          --repo "${GITHUB_REPOSITORY}"
          --ref main
          --raw-field tag_name="${GITHUB_REF_NAME}"
