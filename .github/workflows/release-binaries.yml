name: release-binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Artifact version/name for manual runs (defaults to manual-<run number>)"
        required: false
        type: string

jobs:
  release-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run release gate checks
        env:
          KUJO_ENABLE_SOCKET_TESTS: "1"
        run: bash scripts/release_gate.sh

  build-release-artifacts:
    needs: release-gate
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_NAME: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.version || format('manual-{0}', github.run_number) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build the public Linux binary on the oldest supported Pages image.
          # This keeps its glibc floor compatible with Ubuntu 22.04 consumers.
          - os: ubuntu-22.04
            platform: linux-x64
            binary_name: kujo
            archive_ext: tar.gz
            archive_kind: tar
          - os: macos-15-intel
            platform: macos-x64
            binary_name: kujo
            archive_ext: tar.gz
            archive_kind: tar
          - os: macos-15
            platform: macos-arm64
            binary_name: kujo
            archive_ext: tar.gz
            archive_kind: tar
          - os: windows-latest
            platform: windows-x64
            binary_name: kujo.exe
            archive_ext: zip
            archive_kind: zip

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure OpenSSL for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) {
            $env:VCPKG_INSTALLATION_ROOT = "C:\vcpkg"
          }
          vcpkg install openssl:x64-windows-static-md
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VCPKG_DEFAULT_TRIPLET=x64-windows-static-md" | Out-File -FilePath $env:GITHUB_ENV -Append
          "OPENSSL_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-md" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build release binary
        run: cargo build --release --locked

      - name: Validate binary commands
        shell: bash
        run: |
          set -euo pipefail
          binary_path="target/release/${{ matrix.binary_name }}"
          "${binary_path}" --version
          "${binary_path}" run examples/hello.kujo
          "${binary_path}" lsp --help

      - name: Package artifact and checksum
        shell: bash
        run: |
          set -euo pipefail
          binary_name="${{ matrix.binary_name }}"
          binary_path="target/release/${binary_name}"
          archive_name="kujo-${RELEASE_NAME}-${{ matrix.platform }}.${{ matrix.archive_ext }}"
          mkdir -p dist
          cp "${binary_path}" "dist/${binary_name}"

          if [[ "${{ matrix.archive_kind }}" == "zip" ]]; then
            pwsh -NoLogo -NoProfile -Command "Compress-Archive -Path 'dist/${binary_name}' -DestinationPath '${archive_name}' -Force"
          else
            tar -czf "${archive_name}" -C dist "${binary_name}"
          fi

          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${archive_name}" > "${archive_name}.sha256"
          elif command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "${archive_name}" > "${archive_name}.sha256"
          else
            pwsh -NoLogo -NoProfile -Command "\$hash = (Get-FileHash -Algorithm SHA256 '${archive_name}').Hash.ToLower(); \"\$hash  ${archive_name}\" | Set-Content '${archive_name}.sha256'"
          fi

      - name: Upload artifact bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ matrix.platform }}
          path: |
            kujo-*.tar.gz
            kujo-*.tar.gz.sha256
            kujo-*.zip
            kujo-*.zip.sha256

  publish-release-assets:
    needs: build-release-artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write

    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: release-artifacts

      - name: Build consolidated checksums file
        shell: bash
        run: |
          set -euo pipefail
          find release-artifacts -name '*.sha256' -type f -print0 | sort -z | xargs -0 cat > release-artifacts/checksums.txt

      - name: Publish release assets
        id: publish
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          name: Kujo ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release-artifacts/**/*.tar.gz
            release-artifacts/**/*.zip
            release-artifacts/**/*.sha256
            release-artifacts/checksums.txt

      - name: Dispatch published artifact smoke
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run release-published-artifact-smoke.yml
          --repo "${GITHUB_REPOSITORY}"
          --ref main
          --raw-field tag_name="${GITHUB_REF_NAME}"
