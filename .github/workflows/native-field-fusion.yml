name: native-field-fusion
on:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        session: [1]
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: dtolnay/rust-toolchain@stable
      - name: Record identities
        run: |
          mkdir field-evidence
          git rev-parse HEAD > field-evidence/candidate-source.txt
          rustc -Vv > field-evidence/toolchain.txt
          lscpu > field-evidence/cpu.txt
          git ls-files -z src tests Cargo.toml Cargo.lock benchmarks/langarena/src benchmarks/langarena/test.json | xargs -0 sha256sum > field-evidence/source-hashes.txt
      - name: Check formatting and native root transfers
        run: |
          cargo fmt --check
          cargo test --release --locked --lib -- --nocapture > field-evidence/library.log 2>&1
      - name: Check runtime semantics
        run: |
          cargo test --release --locked --test jit_indexed_field_fusion --test runtime_measurements --test jit_local_store_transfer --test jit_call_contracts --test jit_cold_callback --test jit_callback_depth --test imported_vm_callback --test callback_module_cache --test language_task_contracts --test langarena_port_contracts --test native_root_release --test call_frame_ownership_contracts --test native_call_transfer --test jit_nested_paths --test native_representation_parity --test collection_ownership_contracts > field-evidence/integrations.log 2>&1
      - name: Build and freeze ordinary candidate CLI
        run: |
          cargo build --release --locked --lib --bin kujo --message-format=json > field-evidence/candidate-build.jsonl 2> field-evidence/candidate-build.stderr
          cp target/release/kujo field-evidence/candidate-kujo
          KUJO_LANGARENA_BINARY="$PWD/field-evidence/candidate-kujo" cargo test --release --locked --test langarena_port_contracts all_fifty_upstream_checksums_in_all_runtimes -- --exact --ignored --nocapture > field-evidence/all150.log 2>&1
          ruby -e 's=File.read("field-evidence/all150.log"); abort "all-runtime gate missing" unless s.scan(/^Runtime: (vm|interpreter|jit)$/).flatten == %w[vm interpreter jit] && s.scan(/^Summary: 50, 50, 0$/).size == 3 && s.scan(/: OK /).size == 150 && s.include?("1 passed; 0 failed")'
          field-evidence/candidate-kujo run benchmarks/langarena/build.kujo > field-evidence/port-build.log
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: c27e3a8b449a406f118a63e35a75e580d7c3c856
          path: baseline
      - name: Build and freeze accepted baseline with matching flags
        run: |
          git -C baseline rev-parse HEAD > field-evidence/baseline-source.txt
          cargo build --manifest-path baseline/Cargo.toml --target-dir target --release --locked --lib --bin kujo --message-format=json > field-evidence/baseline-build.jsonl 2> field-evidence/baseline-build.stderr
          cp target/release/kujo field-evidence/baseline-kujo
          sha256sum field-evidence/*-kujo > field-evidence/binary-hashes.txt
      - name: Alternating uninstrumented measurements after all builds
        run: |
          free -k > field-evidence/memory-before.txt
          cat /proc/loadavg > field-evidence/load-before.txt
          ruby benchmarks/langarena/probes/compare-local-store-targets.rb field-evidence/baseline-kujo field-evidence/candidate-kujo field-evidence/timings
          ruby benchmarks/langarena/probes/test-local-store-verifier.rb > field-evidence/verifier-controls.json
          ruby benchmarks/langarena/probes/verify-local-store-targets.rb field-evidence "$(cat field-evidence/candidate-source.txt)" "$(cat field-evidence/candidate-source.txt)" c27e3a8b449a406f118a63e35a75e580d7c3c856 > field-evidence/timing-review.json
          free -k > field-evidence/memory-after.txt
          cat /proc/loadavg > field-evidence/load-after.txt
          sha256sum --check field-evidence/binary-hashes.txt > field-evidence/binary-recheck.txt
          sha256sum --check field-evidence/source-hashes.txt > field-evidence/source-recheck.txt
      - name: Preserve evidence even on failure

        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: field-fusion-session-${{ matrix.session }}
          retention-days: 7
          path: field-evidence/
