name: filesystem-capability-conformance

on:
  push:
    branches: [main]
  pull_request:

jobs:
  descriptor-relative-filesystem:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure OpenSSL for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) {
            $env:VCPKG_INSTALLATION_ROOT = "C:\vcpkg"
          }
          vcpkg install openssl:x64-windows-static-md
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VCPKG_DEFAULT_TRIPLET=x64-windows-static-md" | Out-File -FilePath $env:GITHUB_ENV -Append
          "OPENSSL_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-md" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Run descriptor-relative filesystem conformance
        run: cargo test --locked beneath --lib

      - name: Run VM/interpreter capability parity
        run: cargo test --locked --test native_api_security_boundaries filesystem_

      - name: Run bounded process stdin conformance
        run: cargo test --locked test_process_stdin --lib

      - name: Run bounded GIF converter contracts
        run: cargo test --locked gif_converter --lib

      - name: Install GIF converter for interoperability checks
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y webp

      - name: Run real GIF conversion in both runtimes
        if: runner.os == 'Linux'
        run: cargo test --locked --test gif_conversion_contracts -- --ignored

      - name: Run pure native path validation in both runtimes
        run: cargo test --locked --test path_absolute_contracts --test process_lifetime_contracts
