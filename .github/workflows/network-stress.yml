name: network-stress

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/network-stress.yml
      - scripts/network_stress_gate.sh
      - scripts/loopback_network_probe.rs
      - src/docgen/**
      - tests/docgen_universal.rs
  push:
    branches: [main]
    paths:
      - .github/workflows/network-stress.yml
      - scripts/network_stress_gate.sh
      - scripts/loopback_network_probe.rs
      - src/docgen/**
      - tests/docgen_universal.rs

permissions:
  contents: read

jobs:
  network-stress:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Verify 50 consecutive host and Docgen suites
        env:
          KUJO_NETWORK_STRESS_EVIDENCE: ${{ runner.temp }}/kujo-network-stress
        run: bash scripts/network_stress_gate.sh 50
      - name: Preserve all stress evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: network-stress-${{ matrix.os }}
          path: ${{ runner.temp }}/kujo-network-stress
          if-no-files-found: error
          retention-days: 14
