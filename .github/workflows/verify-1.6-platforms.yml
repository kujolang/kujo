name: Verify exact 1.6 platform artifacts
on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Successful exact-source build run
        required: true
        type: string
permissions:
  actions: read
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, platform: linux-x64}
          - {os: ubuntu-24.04-arm, platform: linux-arm64}
          - {os: macos-15-intel, platform: macos-x64}
          - {os: macos-15, platform: macos-arm64}
          - {os: windows-latest, platform: windows-x64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: release-tools
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 44af277848173664f72ca85f2a1b3b98d634ecdd
          path: source
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.11.0'
      - name: Verify build identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.artifact_run_id }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/kujolang/kujo/actions/runs/$RUN_ID" > build-run.json
          node -e 'const r=require("./build-run.json"); if(r.head_sha!=="44af277848173664f72ca85f2a1b3b98d634ecdd" || r.conclusion!=="success" || r.path!==".github/workflows/release-binaries.yml") process.exit(1)'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-${{ matrix.platform }}
          path: incoming
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - name: Keep reviewed macOS x64 bytes
        if: matrix.platform == 'macos-x64'
        shell: bash
        run: |
          set -euo pipefail
          cd incoming
          curl -fLsS -O https://github.com/kujolang/kujo/releases/download/v1.6.0/kujo-v1.6.0-macos-x64.tar.gz
          printf '%s\n' 'ee8aad0b389256f0d841891b97f6aa0826027f2f70894bb240f82599a678d317  kujo-v1.6.0-macos-x64.tar.gz' > kujo-v1.6.0-macos-x64.tar.gz.sha256
      - name: Validate and execute isolated artifact
        run: node release-tools/scripts/verify_1_6_platform.mjs ${{ matrix.platform }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verification-${{ matrix.platform }}
          path: verification.json
