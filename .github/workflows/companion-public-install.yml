name: Verify released companion packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [workcell, ability, mcp, dispatch, watchdog, kennel]
    steps:
      - name: Install reviewed runtime
        id: kujo
        uses: kujolang/kujo/.github/actions/setup-kujo@fc53093f35e4236682bbbf5ab1ccc8d2b4df990c
        with:
          version: v1.6.0
      - name: Checkout released Kennel client only
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: kujolang/kennel
          ref: 093d44dddcebebd99bd8987e3efcb7e044dc45a7
          path: released-client
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install exact public package and retain pins
        env:
          PACKAGE: ${{ matrix.package }}
          KUJO_BIN: ${{ steps.kujo.outputs.kujo-path }}
        shell: bash
        run: |
          set -euo pipefail
          version=1.2.0
          case "$PACKAGE" in
            workcell) expected=4ec4227f8190e05a329c2ee2975d77fce7872313 ;;
            ability) expected=2dc7d4e9eb25e987544ac48793cd11d1999c45e0 ;;
            mcp) expected=427a8b9ecfaee97cd66c6b35137bd1dc5fb16b54 ;;
            dispatch) expected=7558d0b2157449a484646d9a4b0d069a70c36f85; version=1.3.0 ;;
            watchdog) expected=fafea3abb594638e442127496ca6ac4c9bcd5390 ;;
            kennel) expected=92326c4bc11377ffa9fedf51d8c3ad3e7575e02b; version=1.1.1 ;;
            *) exit 2 ;;
          esac
          project="$RUNNER_TEMP/public-$PACKAGE"
          mkdir -p "$project" "$RUNNER_TEMP/receipt"
          export KENNEL_HOME="$RUNNER_TEMP/kennel-home-$PACKAGE"
          unset KUJO_MODULE_PATH
          cd "$project"
          client="$GITHUB_WORKSPACE/released-client/kennel.kujo"
          "$KUJO_BIN" run "$client" --interpreter -- init --name public-release-consumer
          "$KUJO_BIN" run "$client" --interpreter -- add "$PACKAGE@$version"
          cp kennel.lock "$RUNNER_TEMP/receipt/kennel.lock"
          "$KUJO_BIN" run "$client" --interpreter -- install
          cmp kennel.lock "$RUNNER_TEMP/receipt/kennel.lock"
          curl --fail --silent --show-error "https://kennel.kujolang.ai/api/v1/packages/$PACKAGE/$version.json" -o "$RUNNER_TEMP/receipt/manifest.json"
          jq -e --arg expected "$expected" --arg version "$version" '.version == $version and .source_commit == $expected and .source_tag == ("v" + $version)' "$RUNNER_TEMP/receipt/manifest.json"
          grep -q registry-statement-verified kennel.lock
          sha256sum kennel.lock "$KUJO_BIN" > "$RUNNER_TEMP/receipt/checksums.txt"
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
          echo "CONSUMER=$project" >> "$GITHUB_ENV"
          echo "KUJO_BIN=$KUJO_BIN" >> "$GITHUB_ENV"
          echo "KUJO=$KUJO_BIN" >> "$GITHUB_ENV"
      - name: Verify installed public code without source checkout fallback
        env:
          PACKAGE: ${{ matrix.package }}
        shell: bash
        run: |
          set -euo pipefail
          unset KUJO_MODULE_PATH
          cd "$CONSUMER/kennel_packages/$PACKAGE"
          case "$PACKAGE" in
            dispatch)
              export DISPATCH_ROOT="$PWD"
              export AI_SDK_PATH="$CONSUMER/kennel_packages/ai-sdk"
              export DISPATCH_OFFLINE_FIXTURE=true
              test "$("$KUJO_BIN" run dispatch.kujo version)" = 'Dispatch 1.3.0'
              "$KUJO_BIN" run dispatch.kujo validate --workflow-file examples/workflows/routed-review.json --json
              "$KUJO_BIN" test-run tests/sdk_adapter_tests.kujo -v
              "$KUJO_BIN" test-run tests/failure_gate_safety_tests.kujo -v
              for backend in filesystem sqlite; do
                DISPATCH_STATE_BACKEND="$backend" "$KUJO_BIN" run dispatch.kujo demo "Public package $backend" \
                  --workflow-file examples/workflows/routed-review.json --yes --non-interactive \
                  --output-root "tests/tmp/public-$backend"
              done
              ;;
            watchdog)
              test "$(cat VERSION)" = '1.2.0'
              node tests/release_metadata_check.js
              node tests/api_version_contract_check.js
              node tests/runtime_measurements_adapter_check.js
              ;;
            kennel)
              test "$(sed -n 's/^version = "\(.*\)"/\1/p' kennel.toml | head -1)" = '1.1.1'
              "$KUJO_BIN" run kennel.kujo --interpreter -- validate --project-dir "$CONSUMER"
              bash scripts/verify-deterministic-lockfile.sh
              bash scripts/verify-stale-lockfile.sh
              ;;
            ability) bash tests/run_tests.sh ;;
            workcell)
              test "$(bash bin/workcell --version)" = 'Workcell 1.2.0'
              EMPTY_SECRET='' LONG_SECRET=longsecret AUDIT_SECRET=artifact-secret "$KUJO_BIN" run tests/workcell_test.kujo
              "$KUJO_BIN" run tests/git_commitment_vectors.kujo
              ;;
            mcp)
              # Consumers run from their project so its lockfile supplies transitive roots.
              cd "$CONSUMER"
              "$KUJO_BIN" run kennel_packages/mcp/tests/test_07_ability_projection.kujo --interpreter
              "$KUJO_BIN" run kennel_packages/mcp/tests/test_09_ability_gateway.kujo --interpreter
              # The repository-profile fixture needs the package cwd; restrict its
              # explicit roots to these installed packages, never a source checkout.
              cd kennel_packages/mcp
              KUJO_MODULE_PATH="$CONSUMER/kennel_packages/mcp:$CONSUMER/kennel_packages/ability" \
                "$KUJO_BIN" run tests/test_11_mcp_core_ability_pack.kujo --interpreter
              node tests/controlled_ability_test.mjs
              node tests/ability_host_bridge_test.mjs
              ;;
          esac
      - name: Retain public installation receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-${{ matrix.package }}-${{ env.PACKAGE_VERSION }}
          path: ${{ runner.temp }}/receipt/
          if-no-files-found: error
