name: release-artifact-validation-matrix

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-artifact-install-flow:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"

      - name: Validate release artifact install/checksum flow
        run: bash .github/scripts/validate-release-artifact.sh

      - name: Validate npm runtime package contracts
        run: |
          npm test --prefix npm
          npm run pack:dry-run --prefix npm

      - name: Validate first-party extension smoke check
        working-directory: tools/vscode-kujo-extension
        run: |
          npm ci
          npm run check
