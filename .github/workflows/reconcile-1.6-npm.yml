name: Reconcile reviewed 1.6 npm artifacts
on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Successful exact-source five-platform release build
        required: true
        type: string
permissions:
  actions: read
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Verify build identity
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.artifact_run_id }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/kujolang/kujo/actions/runs/$RUN_ID" > build-run.json
          python3 -c 'import json; r=json.load(open("build-run.json")); assert r["head_sha"]=="44af277848173664f72ca85f2a1b3b98d634ecdd"; assert r["conclusion"]=="success"; assert r["path"]==".github/workflows/release-binaries.yml"'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-*
          path: incoming
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - name: Retain reviewed macOS x64 and neutral packages
        run: python3 scripts/reconcile_1_6_npm.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-reviewed-npm
          path: reviewed/*.tgz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reconciliation-receipt
          path: reviewed/manifest.json
