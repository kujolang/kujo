name: release-performance

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact 40-character runtime commit for the A/A release baseline'
        required: true
        type: string
  pull_request:
    paths:
      - 'scripts/*release_bench.rs'
      - 'scripts/release_performance_campaign.js'
      - 'tests/release_performance_campaign.test.js'
      - '.github/workflows/release-performance.yml'

permissions:
  contents: read

jobs:
  evidence-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - run: node --test tests/release_performance_campaign.test.js

  measure:
    if: github.event_name == 'workflow_dispatch'
    needs: evidence-contract
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            binary: kujo
          - os: macos-15
            binary: kujo
          - os: windows-latest
            binary: kujo.exe
    runs-on: ${{ matrix.os }}
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: Validate immutable source and prepare isolated checkout
        shell: bash
        run: |
          set -euo pipefail
          node -e 'if (!/^[a-f0-9]{40}$/.test(process.env.SOURCE_SHA)) process.exit(1)'
          git worktree add --detach "$RUNNER_TEMP/perf-runtime" "$SOURCE_SHA"
      - name: Configure OpenSSL for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT = "C:\vcpkg" }
          vcpkg install openssl:x64-windows-static-md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VCPKG_DEFAULT_TRIPLET=x64-windows-static-md" | Out-File -FilePath $env:GITHUB_ENV -Append
          "OPENSSL_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-md" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build locked release binary
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path "$RUNNER_TEMP/perf-runtime/Cargo.toml" --release --locked --bin kujo > release-build.log 2>&1
      - name: Measure and verify release corpus
        shell: bash
        env:
          BINARY_NAME: ${{ matrix.binary }}
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/perf-runtime/target/release/$BINARY_NAME"
          node scripts/release_performance_campaign.js "$binary" "$binary" "$SOURCE_SHA" "$SOURCE_SHA" performance-evidence
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-performance-${{ matrix.os }}
          path: |
            performance-evidence/
            release-build.log
          if-no-files-found: error
          retention-days: 90
