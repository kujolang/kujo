name: release-performance

on:
  push:
    branches: [main]
    paths:
      - 'scripts/*release_bench.rs'
      - 'scripts/release_performance_campaign.js'
      - 'scripts/build_release_comparison.js'
      - 'tests/release_performance_campaign.test.js'
      - '.github/workflows/release-performance.yml'
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact 40-character runtime baseline commit'
        required: true
        type: string
      platform:
        description: 'Platform subset for a focused rerun'
        required: true
        default: all
        type: choice
        options: [all, linux, macos, windows]
      candidate_sha:
        description: 'Optional candidate commit; omit for an A/A control'
        required: false
        type: string
  pull_request:
    paths:
      - 'scripts/*release_bench.rs'
      - 'scripts/release_performance_campaign.js'
      - 'scripts/build_release_comparison.js'
      - 'tests/release_performance_campaign.test.js'
      - '.github/workflows/release-performance.yml'

permissions:
  contents: read

jobs:
  evidence-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - run: node --test tests/release_performance_campaign.test.js

  measure:
    if: github.event_name == 'workflow_dispatch'
    needs: evidence-contract
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'windows' && '["windows-latest"]' || inputs.platform == 'macos' && '["macos-15"]' || inputs.platform == 'linux' && '["ubuntu-22.04"]' || '["ubuntu-22.04","macos-15","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: Validate immutable source and prepare isolated checkout
        shell: bash
        run: |
          set -euo pipefail
          node -e 'if (![process.env.SOURCE_SHA, process.env.CANDIDATE_SHA || process.env.SOURCE_SHA].every(s => /^[a-f0-9]{40}$/.test(s))) process.exit(1)'
          git worktree add --detach "$RUNNER_TEMP/perf-runtime" "$SOURCE_SHA"
      - name: Configure OpenSSL for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT = "C:\vcpkg" }
          vcpkg install openssl:x64-windows-static-md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VCPKG_DEFAULT_TRIPLET=x64-windows-static-md" | Out-File -FilePath $env:GITHUB_ENV -Append
          "OPENSSL_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-md" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build locked release binaries
        run: node scripts/build_release_comparison.js
      - name: Measure and verify release corpus
        shell: bash
        env:
          BINARY_NAME: ${{ runner.os == 'Windows' && 'kujo.exe' || 'kujo' }}
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/perf-runtime/target/release/$BINARY_NAME"
          if [ -n "$CANDIDATE_SHA" ] && [ "$CANDIDATE_SHA" != "$SOURCE_SHA" ]; then
            node scripts/release_performance_campaign.js "$RUNNER_TEMP/baseline-$BINARY_NAME" "$RUNNER_TEMP/baseline-$BINARY_NAME" "$SOURCE_SHA" "$SOURCE_SHA" baseline-evidence
          fi
          node scripts/release_performance_campaign.js "$RUNNER_TEMP/baseline-$BINARY_NAME" "$binary" "$SOURCE_SHA" "${CANDIDATE_SHA:-$SOURCE_SHA}" performance-evidence
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-performance-${{ matrix.os }}
          path: |
            performance-evidence/
            baseline-evidence/
            baseline-build.log
            candidate-build.log
            candidate-checkout.log
            windows-perl.log
          if-no-files-found: error
          retention-days: 90
