[package]
name = "pulp"
version = "0.22.3"
edition = "2021"
authors = ["sarah quiñones <sarah@veganb.tw>"]
build = "build.rs"
description = "safe generic simd"
readme = "README.upstream.md"
keywords = ["simd"]
license = "MIT"
repository = "https://github.com/sarah-quinones/pulp/"
publish = false

[features]
default = ["std", "x86-v3", "relaxed-simd"]
macro = ["dep:pulp-macro"]
nightly = ["bytemuck/nightly_stdsimd"]
relaxed-simd = ["pulp-wasm-simd-flag/relaxed-simd"]
std = []
x86-v3 = []
x86-v4 = ["bytemuck/avx512_simd"]

[dependencies]
bytemuck = { version = "1.15", features = ["aarch64_simd", "wasm_simd"] }
cfg-if = "1.0.0"
libm = { version = "0.2", default-features = false }
num-complex = { version = "0.4.4", features = ["bytemuck"], default-features = false }
paste = { package = "pastey", version = "0.2.3" }
pulp-macro = { version = "0.1.1", optional = true }
pulp-wasm-simd-flag = { version = "0.1.1", default-features = false }
reborrow = "0.5"

[build-dependencies]
version_check = "0.9.5"

[target.'cfg(any(target_arch = "x86", target_arch = "x86_64"))'.dependencies]
raw-cpuid = { version = "11.5.0", default-features = false }
