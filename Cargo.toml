[package]
name = "kujo"
version = "1.0.2"
edition = "2021"
authors = ["Kujolang <contact@kujolang.ai>"]
description = "Kujo — A lean, expressive programming language"
license = "MIT"
readme = "README.md"
repository = "https://github.com/kujolang/kujo"

[features]
default = ["runtime-db", "runtime-image", "runtime-archive", "runtime-jit"]
runtime-db = ["dep:rusqlite", "dep:postgres", "dep:mysql_async"]
runtime-image = ["dep:image"]
runtime-archive = ["dep:zip"]
runtime-jit = [
    "dep:cranelift",
    "dep:cranelift-module",
    "dep:cranelift-jit",
    "dep:cranelift-native",
    "dep:target-lexicon",
]

[dependencies]
ahash = "0.8"
clap = { version = "4", features = ["derive"] }
once_cell = "1.21.3"
colored = "2.1"
serde_json = "1.0"
rand = "0.8"
chrono = "0.4"
uuid = { version = "1.10", features = ["v4"] }
regex = "1"
rustyline = "14.0"
tiny_http = { version = "0.12", features = ["ssl-openssl"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = "0.1"
futures = "0.3"
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
postgres = { version = "0.19", features = ["with-chrono-0_4"], optional = true }
mysql_async = { version = "0.37", optional = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros", "time", "io-util", "fs"] }
base64 = "0.21"
jsonwebtoken = { version = "10.4.0", default-features = false, features = ["aws_lc_rs"] }
serde = { version = "1.0", features = ["derive"] }
urlencoding = "2.1"
toml = "0.8"
serde_yaml = "0.9"
csv = "1.3"
image = { version = "0.25", default-features = false, features = [
    "rayon",
    "bmp",
    "dds",
    "exr",
    "ff",
    "gif",
    "hdr",
    "ico",
    "jpeg",
    "png",
    "pnm",
    "qoi",
    "tga",
    "tiff",
    "webp",
], optional = true }
zip = { version = "7.0.0", optional = true }
sha2 = "0.10"
hmac = "0.12"
md-5 = "0.10"
bcrypt = "0.15"
aes-gcm = "0.10"
openssl = { version = "0.10.81", features = ["vendored"] }
nohash-hasher = "0.2"
rayon = "1.10"
mime_guess = "2.0"
infer = "0.16"
libc = "0.2"
rpassword = "7.3.1"
keyring = "4.1.6"

# JIT Compilation
cranelift = { version = "0.112", optional = true }
cranelift-module = { version = "0.112", optional = true }
cranelift-jit = { version = "0.112", optional = true }
cranelift-native = { version = "0.112", optional = true }
target-lexicon = { version = "0.12", optional = true }

[dev-dependencies]
criterion = "0.5"

[[example]]
name = "jit_microbenchmark"
path = "examples/jit_microbenchmark.rs"

[[example]]
name = "jit_simple_test"
path = "examples/jit_simple_test.rs"

[[bench]]
name = "v1_perf_benchmarks"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
