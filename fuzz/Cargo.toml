[package]
name = "kujo-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
kujo = { package = "kujolang", path = "..", default-features = false }

[patch.crates-io]
# cargo-fuzz treats this manifest as its workspace root, so the parent
# workspace patch is not inherited. Keep HTTP hardening available in fuzz
# builds by selecting the same reviewed vendored tiny_http implementation.
tiny_http = { path = "../vendor/tiny_http-0.12.0" }

[[bin]]
name = "lexer"
path = "fuzz_targets/lexer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parser"
path = "fuzz_targets/parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "xml_bounded"
path = "fuzz_targets/xml_bounded.rs"
test = false
doc = false
bench = false
